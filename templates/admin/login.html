<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="robots" content="noindex, nofollow">
    <title>登录 - {{.SiteTitle}}</title>
    {{if .Favicon}}<link rel="icon" href="{{.Favicon}}">{{end}}
    <link rel="stylesheet" href="/static/css/admin.css">
</head>
<body class="login-body">
<div class="login-card">
    <h1>{{.SiteTitle}}</h1>
    <p class="login-sub">管理后台登录</p>
    {{if .Error}}<div class="alert">{{.Error}}</div>{{end}}
    <form method="post" action="/admin/login">
        <label>用户名
            <input type="text" name="username" value="{{.Username}}" required autofocus>
        </label>
        <label>密码
            <input type="password" name="password" required>
        </label>
        <button type="submit" class="btn-block">登 录</button>
    </form>
    <a class="back-home" href="/">&larr; 返回前台</a>
</div>
</body>
</html>
