<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{{.Post.Title}} - {{.SiteTitle}}</title>
    {{if .Favicon}}<link rel="icon" href="{{.Favicon}}">{{end}}
    <link rel="stylesheet" href="/static/css/site.css">
    <link rel="stylesheet" href="/static/highlightjs/atom-one-dark.min.css">
    <link rel="stylesheet" href="/static/viewerjs/viewer.min.css">
</head>
<body>
{{if .TOC}}
<aside class="toc">
    <div class="toc-title">目录</div>
    {{range .TOC}}
    <a href="#{{.ID}}" class="toc-link toc-l{{.Level}}" title="{{.Title}}">{{.Title}}</a>
    {{end}}
</aside>
{{end}}
<div class="page">
    <div class="card">
        <div class="card-head post-head">
            <a class="back" href="/">&larr; 返回列表</a>
            <h1 class="post-title">{{.Post.Title}}</h1>
            <div class="item-meta">
                {{if .Post.CategoryName}}<span class="badge">{{.Post.CategoryName}}</span>{{end}}
                <time>{{.Post.CreatedAt | fmttime}}</time>
            </div>
        </div>
        <div class="post-content">
            {{.ContentHTML}}
        </div>
    </div>
</div>
<footer class="site-footer">
    <div class="footer-divider"></div>
    <p>Powered by gin + sqlite{{if .ICP}} · <a href="https://beian.miit.gov.cn/" target="_blank" rel="noopener">{{.ICP}}</a>{{end}}</p>
</footer>
<script src="/static/highlightjs/highlight.min.js"></script>
<script>
    hljs.registerAliases(["golang"], { languageName: "go" });
    document.querySelectorAll(".post-content pre code").forEach(function (block) {
        hljs.highlightElement(block);
    });
</script>
<script src="/static/editormd/jquery.min.js"></script>
<script src="/static/viewerjs/viewer.min.js"></script>
<script src="/static/viewerjs/jquery-viewer.min.js"></script>
<script>
    // 文章图片：Viewer.js 查看器（滚轮缩放 / 旋转 / 翻转 / 多图切换 / 全屏）
    $('.post-content').viewer({
        url: 'src',
        title: function (img) { return img.alt || ''; },
        toolbar: true,
        navbar: true
    });
    // 文章视频：点击原生全屏放大
    document.querySelectorAll('.post-content video').forEach(function (v) {
        v.addEventListener('click', function (e) {
            if (document.fullscreenElement === v) return;
            e.preventDefault();
            if (v.requestFullscreen) v.requestFullscreen();
            else if (v.webkitRequestFullscreen) v.webkitRequestFullscreen();
        });
    });
</script>
<button type="button" class="back-top" id="backTop" aria-label="回到顶部">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="18 15 12 9 6 15"/></svg>
</button>
<a href="/" class="fixed-btn back-home" aria-label="返回首页" title="返回首页">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
</a>
<script>
    (function () {
        var btn = document.getElementById('backTop');
        function onScroll() {
            btn.classList.toggle('show', window.scrollY > 300);
        }
        window.addEventListener('scroll', onScroll, { passive: true });
        onScroll();
        btn.addEventListener('click', function () {
            window.scrollTo({ top: 0, behavior: 'smooth' });
        });
    })();
</script>
</body>
</html>
